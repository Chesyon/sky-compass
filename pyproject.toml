[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-compass"
version = "0.0.0"
authors = [
    {name = "Chesyon"},
]
description = "CLI utility to convert RAM addresses between releases of PMD:EoS"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["rom-hacking", "game-modding"]
classifiers = [
    "Development Status :: 4 - Beta",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pmdsky-debug-py >= 10.0.0",
    "pydantic >= 2.13.0"
]

[project.optional-dependencies]
api = ["fastapi>=0.136.0"]

[project.scripts]
sky-compass = "sky_compass.cli:main"

[project.urls]
Repository = "https://github.com/Chesyon/sky-compass"
Issues = "https://github.com/Chesyon/sky-compass/issues"

[tool.fastapi]
entrypoint = "sky_compass.api:app"

[tool.ruff]
line-length = 120
